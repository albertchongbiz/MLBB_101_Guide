<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB 101: Interactive Tactical Guide (v1.06)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        cardbg: '#131c31',
                        accent: '#6366f1',
                        gold: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(19, 28, 49, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-pulse {
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.9)); }
            100% { transform: scale(1); opacity: 0.8; }
        }
        @keyframes dashMove {
            to { stroke-dashoffset: -20; }
        }
        .animate-dash {
            stroke-dasharray: 6,6;
            animation: dashMove 1s linear infinite;
        }
        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen pb-16">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg">
                <span class="text-sm font-black text-white">101</span>
            </div>
            <div>
                <h1 class="font-bold text-sm leading-tight text-white">Land of Dawn: MLBB 101</h1>
                <p class="text-[10px] text-indigo-300">Tactical Map & Lesson Guide</p>
            </div>
        </div>
        <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 flex items-center">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> v1.06 Live
        </span>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- Horizontal Scrolling Menu Bar (Just like the video interface) -->
        <div class="flex space-x-2 overflow-x-auto pb-2 pt-1 no-scrollbar" id="menu-bar">
            <button onclick="selectLesson('gold')" id="menu-gold" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shrink-0 shadow transition">Gold</button>
            <button onclick="selectLesson('exp')" id="menu-exp" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">EXP</button>
            <button onclick="selectLesson('mid')" id="menu-mid" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">Mid</button>
            <button onclick="selectLesson('roles')" id="menu-roles" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">Roles</button>
            <button onclick="selectLesson('bluetank')" id="menu-bluetank" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">Blue Turrets</button>
            <button onclick="selectLesson('redtank')" id="menu-redtank" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">Red Turrets</button>
            <button onclick="selectLesson('turtle')" id="menu-turtle" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">Turtle</button>
            <button onclick="selectLesson('lord')" id="menu-lord" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">Lord</button>
            <button onclick="selectLesson('orange')" id="menu-orange" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">Orange Buff</button>
            <button onclick="selectLesson('purple')" id="menu-purple" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition">Purple Buff</button>
        </div>

        <!-- 3D Interactive Map Widget -->
        <div class="glass rounded-2xl p-3 shadow-xl space-y-3">
            <div class="flex items-center justify-between px-1">
                <span id="lesson-counter" class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider">Lesson 1 / 10</span>
                <button onclick="resetMapView()" class="text-[10px] text-slate-400 hover:text-white bg-slate-800/80 px-2 py-0.5 rounded-md transition">Reset View 🔄</button>
            </div>

            <!-- Map Container with 3D Map Image and Locked Isometric SVG Overlay -->
            <div class="relative w-full aspect-[1/1] rounded-xl overflow-hidden border border-slate-800 shadow-inner bg-slate-950 flex items-center justify-center">
                <!-- Background 3D Isometric Map Image -->
                <img src="1000433062.webp" alt="Land of Dawn 3D Map" class="absolute inset-0 w-full h-full object-cover opacity-95">

                <!-- Mathematically Aligned Isometric SVG Overlay -->
                <svg viewBox="0 0 500 500" class="absolute inset-0 w-full h-full pointer-events-none z-10">
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
                        </marker>
                    </defs>

                    <!-- 1. GOLD LANE -->
                    <g id="layer-gold">
                        <path d="M 120,380 L 250,75 L 420,225" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" class="glow-pulse"/>
                        <circle cx="120" cy="380" r="10" fill="#f59e0b" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="120" y="383" font-size="9" fill="#000" font-weight="bold" text-anchor="middle">1</text>
                        <circle cx="420" cy="225" r="10" fill="#ef4444" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="420" y="228" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
                    </g>

                    <!-- 2. EXP LANE -->
                    <g id="layer-exp" class="hidden">
                        <path d="M 120,380 L 75,235 L 380,100" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" class="glow-pulse"/>
                        <circle cx="120" cy="380" r="10" fill="#8b5cf6" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="120" y="383" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
                        <circle cx="380" cy="100" r="10" fill="#ef4444" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="380" y="103" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
                    </g>

                    <!-- 3. MID LANE -->
                    <g id="layer-mid" class="hidden">
                        <path d="M 120,380 L 250,250 L 380,100" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" class="glow-pulse"/>
                        <circle cx="250" cy="250" r="14" fill="#ec4899" fill-opacity="0.8" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="250" y="254" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Mid</text>
                    </g>

                    <!-- 4. ROLES OVERVIEW -->
                    <g id="layer-roles" class="hidden">
                        <path d="M 120,380 L 250,75 L 420,225" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4"/>
                        <path d="M 120,380 L 75,235 L 380,100" fill="none" stroke="#14b8a6" stroke-width="3" stroke-dasharray="4"/>
                        <path d="M 120,380 L 250,250 L 380,100" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="4"/>
                    </g>

                    <!-- 5. BLUE TURRETS (9 Towers) -->
                    <g id="layer-bluetank" class="hidden">
                        <!-- Gold Lane Turrets -->
                        <rect x="235" y="100" width="10" height="10" fill="#3b82f6" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="290" y="150" width="10" height="10" fill="#3b82f6" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="350" y="195" width="10" height="10" fill="#3b82f6" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <!-- Mid Lane Turrets -->
                        <rect x="190" y="180" width="10" height="10" fill="#3b82f6" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="220" y="220" width="10" height="10" fill="#3b82f6" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <!-- EXP Lane Turrets -->
                        <rect x="115" y="250" width="10" height="10" fill="#3b82f6" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="145" y="300" width="10" height="10" fill="#3b82f6" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="180" y="340" width="10" height="10" fill="#3b82f6" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <!-- Base Turret -->
                        <rect x="105" y="365" width="12" height="12" fill="#3b82f6" stroke="#fff" stroke-width="1.5" rx="2" class="glow-pulse"/>
                    </g>

                    <!-- 6. RED TURRETS (9 Towers) -->
                    <g id="layer-redtank" class="hidden">
                        <rect x="260" y="380" width="10" height="10" fill="#ef4444" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="210" y="330" width="10" height="10" fill="#ef4444" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="160" y="290" width="10" height="10" fill="#ef4444" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="310" y="300" width="10" height="10" fill="#ef4444" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="280" y="260" width="10" height="10" fill="#ef4444" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="380" y="225" width="10" height="10" fill="#ef4444" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="350" y="180" width="10" height="10" fill="#ef4444" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="310" y="140" width="10" height="10" fill="#ef4444" stroke="#fff" stroke-width="1.2" rx="2"/>
                        <rect x="395" y="115" width="12" height="12" fill="#ef4444" stroke="#fff" stroke-width="1.5" rx="2" class="glow-pulse"/>
                    </g>

                    <!-- 7. TURTLE -->
                    <g id="layer-turtle" class="hidden">
                        <circle cx="210" cy="165" r="16" fill="#10b981" fill-opacity="0.9" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="210" y="169" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Turtle</text>
                    </g>

                    <!-- 8. LORD -->
                    <g id="layer-lord" class="hidden">
                        <circle cx="250" cy="250" r="18" fill="#eab308" fill-opacity="0.9" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="250" y="254" font-size="8" fill="#000" font-weight="bold" text-anchor="middle">Lord</text>
                    </g>

                    <!-- 9. ORANGE BUFF -->
                    <g id="layer-orange" class="hidden">
                        <circle cx="180" cy="190" r="14" fill="#f97316" fill-opacity="0.9" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="180" y="193" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Orange</text>
                        <circle cx="320" cy="310" r="14" fill="#f97316" fill-opacity="0.9" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="320" y="313" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Orange</text>
                    </g>

                    <!-- 10. PURPLE BUFF -->
                    <g id="layer-purple" class="hidden">
                        <circle cx="170" cy="300" r="14" fill="#a855f7" fill-opacity="0.9" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="170" y="303" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Purple</text>
                        <circle cx="330" cy="200" r="14" fill="#a855f7" fill-opacity="0.9" stroke="#fff" stroke-width="2" class="glow-pulse"/>
                        <text x="330" y="203" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Purple</text>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Dynamic Lesson Explanation Box (Matches video bottom card) -->
        <div class="glass rounded-2xl p-4 space-y-3 shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span id="lesson-title" class="font-extrabold text-sm uppercase tracking-wide text-indigo-400">Gold Lane</span>
                <span id="lesson-index" class="text-xs text-slate-400 font-semibold">1 / 10</span>
            </div>
            <p id="lesson-desc" class="text-xs text-slate-200 leading-relaxed">
                A line from point 1, the blue side, to point 2, the red base. This is the marksman's lane. Minions on this lane pay bonus gold. The cannon in the early waves is worth even more—last-hit it.
            </p>
            <div class="flex justify-between pt-2">
                <button onclick="prevLesson()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition">Back</button>
                <button onclick="nextLesson()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">Next lesson</button>
            </div>
        </div>

    </main>

    <!-- Script Engine -->
    <script>
        const lessons = [
            {
                id: 'gold',
                title: 'Gold Lane',
                counter: '1 / 10',
                desc: 'A line from point 1, the blue side, to point 2, the red base. This is the marksman\'s lane. Minions on this lane pay bonus gold. The cannon in the early waves is worth even more—last-hit it.'
            },
            {
                id: 'exp',
                title: 'EXP Lane',
                counter: '2 / 10',
                desc: 'Point 1 to point 2 along the fighter\'s lane. Bonus experience, not bonus gold. You should hit level 4 before the gold laner. That spike is your first fight.'
            },
            {
                id: 'mid',
                title: 'Mid Lane',
                counter: '3 / 10',
                desc: 'The short diagonal. Mages clear it and leave. Mid is the closest hero to both river pits. A good mid is at the first Turtle. Clear the wave before you roam, or your tower eats damage.'
            },
            {
                id: 'roles',
                title: 'Who Goes Where',
                counter: '4 / 10',
                desc: 'Five heroes, three lanes, two jungles. The lanes are the pins. The pins are the buffs. Gold, the amber line: marksman. EXP, the teal line: fighter. Mid, the pale line: mage.'
            },
            {
                id: 'bluetank',
                title: 'Blue Turrets',
                counter: '5 / 10',
                desc: 'The nine blue towers, counting out from the bottom-left base. Each lane has an outer, an inner and a base tower. That is your shield.'
            },
            {
                id: 'redtank',
                title: 'Red Turrets',
                counter: '6 / 10',
                desc: 'The nine red towers, wrapped around the top-right base. Red\'s Gold towers run down the right edge. EXP towers sit on the left.'
            },
            {
                id: 'turtle',
                title: 'Turtle',
                counter: '7 / 10',
                desc: 'The lower river pit. Spawns early, grants global gold and shield. Contesting this determines early momentum.'
            },
            {
                id: 'lord',
                title: 'Lord',
                counter: '8 / 10',
                desc: 'The upper river pit. From 8:00 this is the objective that ends games. Slaying the Lord sends it down a lane to hit towers. Someone still has to push with it.'
            },
            {
                id: 'orange',
                title: 'Orange Buff',
                counter: '9 / 10',
                desc: 'For both camps: Damage, and a slow on your attacks. Blue\'s camp is in the lower jungle. Red\'s is in the upper jungle, toward the EXP lane. This is the buff the marksman takes once they are farmed.'
            },
            {
                id: 'purple',
                title: 'Purple Buff',
                counter: '10 / 10',
                desc: 'Energy and cooldown reduction. Essential for assassins and mana-hungry mages to spam skills continuously without running dry.'
            }
        ];

        let currentIndex = 0;
        const keys = ['gold', 'exp', 'mid', 'roles', 'bluetank', 'redtank', 'turtle', 'lord', 'orange', 'purple'];

        function selectLesson(key) {
            currentIndex = keys.indexOf(key);
            if (currentIndex === -1) currentIndex = 0;
            updateView();
        }

        function nextLesson() {
            currentIndex = (currentIndex + 1) % lessons.length;
            updateView();
        }

        function prevLesson() {
            currentIndex = (currentIndex - 1 + lessons.length) % lessons.length;
            updateView();
        }

        function resetMapView() {
            updateView();
        }

        function updateView() {
            const lesson = lessons[currentIndex];
            const activeKey = keys[currentIndex];

            // Update text content
            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('lesson-counter').innerText = `Lesson ${lesson.counter}`;
            document.getElementById('lesson-index').innerText = lesson.counter;
            document.getElementById('lesson-desc').innerText = lesson.desc;

            // Highlight menu button
            keys.forEach(k => {
                const btn = document.getElementById(`menu-${k}`);
                if (btn) {
                    if (k === activeKey) {
                        btn.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shrink-0 shadow transition";
                        btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    } else {
                        btn.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 shrink-0 hover:text-white transition";
                    }
                }
            });

            // Toggle SVG layers
            keys.forEach(k => {
                const layer = document.getElementById(`layer-${k}`);
                if (layer) {
                    if (k === activeKey) {
                        layer.classList.remove('hidden');
                    } else {
                        layer.classList.add('hidden');
                    }
                }
            });
        }

        // Initialize on load
        window.onload = function() {
            updateView();
        };
    </script>
</body>
</html>
