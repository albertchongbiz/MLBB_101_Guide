<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLBB 101 — Land of Dawn</title>
<meta name="description" content="Interactive Land of Dawn map: gold lane, EXP lane, minion waves, eighteen turrets, Turtle, Lord, purple and orange buffs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07141c;
    --surface: #102029;
    --surface-2: #17303a;
    --fg: #e7f2ef;
    --muted: #8ea6ad;
    --gold: #e4b15a;
    --ink: #1a1204;
    --line: #234049;
    --sans: "Figtree", "Segoe UI", sans-serif;
    --display: "Rajdhani", "Figtree", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .brand { margin: 0; }
  .eyebrow {
    margin: 0;
    font-family: var(--display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-size: 28px;
    line-height: 1;
    font-weight: 700;
  }
  .hint { margin: 0; color: var(--muted); font-size: 14px; text-align: right; max-width: 280px; }
  .shell { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  nav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .group { display: flex; gap: 8px; flex: none; }
  .group h2 {
    display: none;
    margin: 0;
    padding: 4px 4px 0;
    font-family: var(--display);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .chip, .mini, .step {
    min-height: 44px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 0 16px;
    font-family: var(--display);
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] {
    background: var(--surface-2);
    color: var(--fg);
    border-color: var(--gold);
  }
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .stage {
    position: relative;
    flex: 1;
    min-height: 220px;
    display: grid;
    place-items: center;
    perspective: 1400px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #143440 0%, #07141c 68%);
    touch-action: none;
  }
  .plane {
    position: relative;
    width: min(96%, 1040px);
    aspect-ratio: 1959 / 1080;
    transform: rotateX(var(--rx, 14deg)) rotateY(var(--ry, -8deg));
    transform-style: preserve-3d;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 28px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(228, 177, 90, 0.28);
    will-change: transform;
  }
  .plane.is-reset { transition: transform 420ms ease; }
  .plane img, .plane svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .plane svg { pointer-events: none; }
  .pin { pointer-events: auto; cursor: pointer; }
  .drag-note, .reset { position: absolute; top: 12px; z-index: 2; }
  .drag-note {
    left: 12px;
    margin: 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(16, 32, 41, 0.9);
    color: var(--muted);
    font-size: 12px;
  }
  .reset {
    right: 12px;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    font-size: 14px;
  }
  .sheet {
    flex: none;
    max-height: 42dvh;
    overflow: auto;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 16px 16px 12px;
  }
  .sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .kicker {
    margin: 0;
    font-family: var(--display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }
  h3 { margin: 0; font-family: var(--display); font-size: 26px; line-height: 1.1; }
  .count { margin: 0; color: var(--muted); font-family: var(--display); font-size: 14px; }
  .lede { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .filters, .pins, .steps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .mini[aria-pressed="true"], .step.primary {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .callout {
    margin: 12px 0 0;
    padding: 10px 12px;
    border: 1px solid var(--gold);
    border-radius: 12px;
    background: var(--bg);
    font-size: 14px;
  }
  .callout strong { color: var(--gold); font-family: var(--display); }
  ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li { border-left: 2px solid var(--gold); padding-left: 12px; font-size: 14px; }
  .fine { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
  .steps { margin-top: 12px; }
  .step { flex: 1; }
  @media (min-width: 960px) {
    .hint { display: block; }
    .shell { flex-direction: row; }
    nav {
      width: 300px;
      flex-direction: column;
      overflow: auto;
      border-bottom: 0;
      border-right: 1px solid var(--line);
      padding: 12px;
      gap: 14px;
    }
    .group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .group h2 { display: block; grid-column: 1 / -1; }
    .chip { width: 100%; border-radius: 10px; text-align: left; }
    .sheet { max-height: 300px; }
  }
  @media (max-width: 959px) {
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .plane.is-reset { transition: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <p class="eyebrow">Land of Dawn</p>
    <h1 class="brand">MLBB 101</h1>
  </div>
  <p class="hint">Tap a lesson. Lanes draw from point 1 to point 2. Towers, Turtle and buffs pin the spot.</p>
</header>
<div class="shell">
  <nav id="nav" aria-label="Lessons"></nav>
  <div class="main">
    <div class="stage" id="stage">
      <p class="drag-note">Drag to tilt</p>
      <button class="reset" id="reset" type="button">Reset view</button>
      <div class="plane" id="plane">
        <img id="map" alt="Land of Dawn, blue base bottom-left, red base top-right" src="mlbb_map.webp">
        <svg id="svg" viewBox="0 0 1959 1080" role="img" aria-label="Map marks"></svg>
      </div>
    </div>
    <section class="sheet" id="sheet" aria-live="polite"></section>
  </div>
</div>
<script>
const W = 1959, H = 1080;
const NS = "http://www.w3.org/2000/svg";
const GOLD = "#e4b15a", EXP = "#5eead4", MID = "#f4efe2";
const BLUE = "#38bdf8", RED = "#fb7185", PURPLE = "#c084fc", ORANGE = "#fb923c";
const TURTLE = "#3ddc97", LORD = "#f5c16c";

const GOLD_PATH = [[26,75],[34,74.6],[48,74.2],[60,73.6],[72,72],[77,66],[80.2,56],[80.4,46],[79.6,36],[78.5,28],[75.2,19]];
const EXP_PATH = [[23,70],[21.5,59],[21.4,48],[22.5,36],[24.5,28.5],[34,23],[46,21],[56,20.5],[66,21],[73.5,18]];
const MID_PATH = [[26,67],[31,60],[39,54],[47,46],[56,38],[64,31],[71,25],[74.5,18]];
const LANES = { gold: { color: GOLD, points: GOLD_PATH }, exp: { color: EXP, points: EXP_PATH }, mid: { color: MID, points: MID_PATH } };
const LANE_NAME = { gold: "Gold", exp: "EXP", mid: "Mid" };
const TIER_DETAIL = {
  outer: "Outer tower. First defense of the lane, and it starts the match with a shield. The shots heat up the longer a hero stands in range. Taking it pays team gold and opens the jungle behind it.",
  inner: "Inner tower. The second wall. The Lord can crack these. Don't stand in one alone in the early game — the damage ramps if you stay.",
  base: "Base tower. It guards that lane's inhibitor. When the inhibitor falls, your waves on this lane include a super minion."
};

function turret(team, lane, tier, at) { return { id: team + "-" + lane + "-" + tier, team, lane, tier, at }; }
const TURRETS = [
  turret("blue","exp","base",[22.2,58.2]), turret("blue","exp","inner",[21.6,47.2]), turret("blue","exp","outer",[24.0,28.2]),
  turret("blue","mid","base",[29.8,59.8]), turret("blue","mid","inner",[38.5,55.5]), turret("blue","mid","outer",[45.8,47.4]),
  turret("blue","gold","base",[30.6,74.8]), turret("blue","gold","inner",[53.6,74.6]), turret("blue","gold","outer",[72.0,72.0]),
  turret("red","exp","outer",[36.8,23.4]), turret("red","exp","inner",[50.2,21.4]), turret("red","exp","base",[64.8,22.0]),
  turret("red","mid","outer",[61.5,34.5]), turret("red","mid","inner",[66.0,31.5]), turret("red","mid","base",[70.5,28.0]),
  turret("red","gold","outer",[81.0,54.2]), turret("red","gold","inner",[79.6,41.2]), turret("red","gold","base",[79.2,29.2])
];
function turretPin(t) {
  const side = t.team === "blue" ? "Blue" : "Red";
  return { id: t.id, at: t.at, color: t.team === "blue" ? BLUE : RED, label: side + " · " + LANE_NAME[t.lane] + " · " + t.tier, detail: side + " " + LANE_NAME[t.lane].toLowerCase() + " lane, " + t.tier + " tower. " + TIER_DETAIL[t.tier] };
}
const BASES = [
  { id: "blue-base", at: [22.2,74.6], color: BLUE, label: "Blue base", detail: "Blue crystal, bottom-left of this picture. Heroes revive and heal in the fountain here. Destroy the red crystal to win — not this one." },
  { id: "red-base", at: [75.0,17.0], color: RED, label: "Red base", detail: "Red crystal, the spire at the top-right. This is the win condition. The nine red towers are what you remove first." }
];
const BUFFS = {
  purple: [
    { id: "blue-purple", at: [33.0,44.6], color: PURPLE, label: "Blue purple buff", detail: "Blue-side purple camp, in the left jungle. Cooldown reduction plus mana or energy regen. Mages and many junglers hold it. It returns about 90 seconds after it dies." },
    { id: "red-purple", at: [66.6,42.0], color: PURPLE, label: "Red purple buff", detail: "Red-side purple camp, in the right jungle. Same buff: cooldown and mana or energy. Steal it on an invade, then leave." }
  ],
  orange: [
    { id: "blue-orange", at: [49.8,63.5], color: ORANGE, label: "Blue orange buff", detail: "Blue-side orange camp, lower jungle between mid and the Gold lane. Bonus damage and a slow on hit. Later in the game the marksman often takes this from the jungler." },
    { id: "red-orange", at: [56.4,36.8], color: ORANGE, label: "Red orange buff", detail: "Red-side orange camp, upper jungle toward the EXP lane. Damage and a slow. Junglers often clear the EXP-side buff first so the path ends near Gold lane for a gank." }
  ]
};
const PITS = {
  turtle: [{ id: "turtle", at: [64.2,57.2], color: TURTLE, label: "Turtle pit", detail: "The Turtle is the creature in this round lower pit, beside the Gold lane on the artwork. It first spawns at 2:00. In the current season the first one actually appears beside the EXP lane, and the minimap marks whichever pit is next — trust the icon. The team shares gold and EXP. The jungler should last-hit it with Retribution. Turtles stop when the Lord arrives at 8:00." }],
  lord: [{ id: "lord", at: [40.6,35.2], color: LORD, label: "Lord pit", detail: "The Lord is the larger creature in the upper river, beside the EXP lane on this picture. It spawns at 8:00, walks a lane, and sieges towers for the team that slayed it. It respawns faster after 18:00 and evolves into a stronger Lord. Don't start it while the enemy jungler is alive next to the pit." }]
};

const LESSONS = [
  { id: "gold", group: "Lanes", title: "Gold lane", short: "Gold", lede: "A line from point 1, the blue side, to point 2, the red base. This is the marksman's lane.", bullets: ["Minions on this lane pay bonus gold. The cannon in the early waves is worth even more — last-hit it.", "On this map the lane runs along the bottom, then turns up the right side into the red base.", "You are the damage on Turtle and Lord. Shove the wave, then walk to the pit. Don't wander into a dark river alone.", "The outer tower here is a team gold spike. Take it when the enemy marksman has backed."] },
  { id: "exp", group: "Lanes", title: "EXP lane", short: "EXP", lede: "Point 1 to point 2 along the fighter's lane. Bonus experience, not bonus gold.", bullets: ["You should hit level 4 before the gold laner. That spike is your first fight.", "The lane climbs the left edge, then crosses the top into the red base.", "Cut the wave and rotate when mid calls. Missing a whole wave to stand in a lost river is how you fall behind.", "Later this lane sits beside the Lord pit. Don't donate the outer tower for a wave you could have frozen."] },
  { id: "mid", group: "Lanes", title: "Mid lane", short: "Mid", lede: "The short diagonal. Mages clear it and leave.", bullets: ["Mid is the closest hero to both river pits. A good mid is at the first Turtle.", "Clear the wave before you roam, or your tower eats a cannon for free.", "The Lithowanderer near the river restores mana and gives a short speed boost on the way to a side lane.", "Losing the mid tower opens your jungle. That is a map problem, not just a lane problem."] },
  { id: "roles", group: "Lanes", title: "Who goes where", short: "Roles", lede: "Five heroes, three lanes, two jungles. The lines are the lanes. The pins are the buffs.", bullets: ["Gold, the amber line: marksman. EXP, the teal line: fighter. Mid, the pale line: mage.", "Purple and orange pins are the jungler's camps. They take them with Retribution and gank — they don't own a minion wave.", "Roam has no pin. Tank or support, the roamer walks between all of this: vision, sets, and the Turtle fight.", "Lane swaps happen in pro play. In a normal rank game, gold still meets gold and EXP still meets EXP."] },
  { id: "minion-gold", group: "Minions", title: "Gold minions", short: "Gold wave", lede: "The wave that walks the Gold lane, from each base toward the other.", bullets: ["Melee minions, ranged minions, and a cannon every few waves. The cannon is the gold you are not allowed to miss.", "Towers shoot minions before heroes. They switch to you if you damage an enemy hero under the tower.", "For about the first ten waves, this lane's cannon is worth extra gold. That is why the lane has its name.", "When the inhibitor behind the base tower falls, a super minion joins this wave."] },
  { id: "minion-mid", group: "Minions", title: "Mid minions", short: "Mid wave", lede: "The middle wave. Shortest walk, fastest crash.", bullets: ["Because the lane is short, the wave meets in the river sooner than the side lanes.", "A crashed mid wave is your timer to rotate. An unshoved mid wave is a reason to stay.", "Same tower rule: minions draw the shots until a hero hits another hero.", "Super minions appear here too, once this lane's inhibitor is down."] },
  { id: "minion-exp", group: "Minions", title: "EXP minions", short: "EXP wave", lede: "The wave on the fighter's lane. Experience is the resource, not the cannon gold.", bullets: ["Solo the wave and you level faster than a duo lane. That is the entire point of EXP.", "Don't let the jungler tax it early. Their level comes from camps, yours comes from this.", "Freezing near your inner tower is legal and annoying. The enemy has to walk up.", "Inhibitor down on this lane sends a super minion with the wave."] },
  { id: "minions", group: "Minions", title: "All three waves", short: "All waves", lede: "Gold, mid and EXP at once. Minions have been walking these three lines since 0:00.", bullets: ["Amber is Gold, along the bottom and the right. Teal is EXP, along the left and the top. Pale is mid.", "Each base sends a wave down every lane. They meet in the middle and fight until a hero shows up.", "Farm your own lane early. A jungler who takes your cannon is taxing the carry.", "Siege is just minions plus a hero who doesn't cancel the wave. Towers fall to waves, not to hope."] },
  { id: "turrets", group: "Turrets", title: "All turrets", short: "All 18", lede: "Nine towers on each side. Three lanes, three towers deep: outer, inner, base.", bullets: ["Frost pins are blue. Crimson pins are red. Tap one to name the lane and the tier.", "Outer towers start with a shield. Inner towers are the second wall. Base towers guard the inhibitor.", "Shots heat up. The longer you stand in range, the harder they hit. Minions draw aggro until you hit a hero.", "The crystal is not one of the nine. The towers are how you reach it."] },
  { id: "turrets-blue", group: "Turrets", title: "Blue turrets", short: "Blue 9", lede: "The nine blue towers, counting out from the bottom-left base.", bullets: ["Each lane has an outer, an inner and a base tower. That is the whole set.", "Blue's Gold towers sit along the bottom. EXP towers climb the left. Mid towers step up the diagonal.", "Your own outer tower is a resource. Giving it for a wave you didn't need to take is a bad trade.", "Filter by tier if you only want the outers, the inners, or the base towers."] },
  { id: "turrets-red", group: "Turrets", title: "Red turrets", short: "Red 9", lede: "The nine red towers, wrapped around the top-right base.", bullets: ["Red's Gold towers run down the right edge. EXP towers sit along the top. Mid towers guard the diagonal into the base.", "The outer is the one nearest the river. The base tower is the one nearest the crystal.", "Diving a base tower without minions is how marksmen donate shutdown gold.", "Take outers across the map before you ARAM one lane into a base tower."] },
  { id: "turtle", group: "Objectives", title: "Turtle", short: "Turtle", lede: "The round pit in the lower river. Early-game team gold.", bullets: ["On this artwork the Turtle sits beside the Gold lane. Spawn time is 2:00.", "Current season: the first Turtle spawns beside the EXP lane, and later ones move. The minimap shows the next pit. Don't memorize only one side.", "Gold and EXP go to the whole team. Retribution gets the last hit. A stolen Turtle is a double loss.", "They stop at 8:00, when the Lord takes over. There are only a few each match."] },
  { id: "lord", group: "Objectives", title: "Lord", short: "Lord", lede: "The upper river pit. From 8:00 this is the objective that ends games.", bullets: ["Slaying the Lord sends it down a lane to hit towers. Someone still has to push with it.", "It respawns on a few-minute timer, shorter after 18:00, and it evolves into a stronger Lord around then.", "Start it when you know the enemy jungler is dead or far. A retribution steal swings the map.", "On this picture the Lord is the large creature in the upper pit, beside the EXP lane."] },
  { id: "purple", group: "Objectives", title: "Purple buff", short: "Purple", lede: "Both purple camps. Cooldown reduction, and mana or energy back.", bullets: ["Blue's camp is in the left jungle. Red's is in the right jungle. Same buff, mirrored.", "Junglers and mages want it. Marksmen usually do not.", "Camps are up as the match starts and return about 90 seconds after they die. Time your invade off that.", "Leave the last hit to the hero who will hold the buff."] },
  { id: "orange", group: "Objectives", title: "Orange buff", short: "Orange", lede: "Both orange camps. Damage, and a slow on your attacks.", bullets: ["Blue's camp is in the lower jungle. Red's is in the upper jungle, toward the EXP lane.", "This is the buff the marksman takes once they are the team's damage. Early, it belongs to the jungler.", "A common first clear starts on the buff nearer EXP, so you finish near Gold lane in time to gank.", "Respawn is about 90 seconds, same as purple."] },
  { id: "bases", group: "Objectives", title: "Bases", short: "Bases", lede: "Two crystals. Destroy the enemy one. That is the whole game.", bullets: ["Blue is the fountain at the bottom-left. Red is the spire at the top-right.", "The fountain heals you. Recalling is a skill. Dying with 2,000 gold in your pocket is not.", "Nine towers stand in front of each crystal. The base towers are the last of those nine, not the crystal itself.", "A lord marching into a base with no one home is how matches actually end."] }
];
const GROUPS = ["Lanes", "Minions", "Turrets", "Objectives"];

function lanePins(lane) { return TURRETS.filter((t) => t.lane === lane).map(turretPin); }
function pathOf(lane) { return { id: lane, color: LANES[lane].color, points: LANES[lane].points }; }
function viewFor(id, tier) {
  if (id === "gold") return { paths: [pathOf("gold")], pins: [], numbered: true };
  if (id === "exp") return { paths: [pathOf("exp")], pins: [], numbered: true };
  if (id === "mid") return { paths: [pathOf("mid")], pins: [], numbered: true };
  if (id === "roles") return { paths: [pathOf("gold"), pathOf("exp"), pathOf("mid")], pins: BUFFS.purple.concat(BUFFS.orange), numbered: false };
  if (id === "minion-gold") return { paths: [pathOf("gold")], pins: lanePins("gold"), numbered: true };
  if (id === "minion-mid") return { paths: [pathOf("mid")], pins: lanePins("mid"), numbered: true };
  if (id === "minion-exp") return { paths: [pathOf("exp")], pins: lanePins("exp"), numbered: true };
  if (id === "minions") return { paths: [pathOf("gold"), pathOf("exp"), pathOf("mid")], pins: [], numbered: false };
  if (id === "turrets" || id === "turrets-blue" || id === "turrets-red") {
    const team = id === "turrets-blue" ? "blue" : id === "turrets-red" ? "red" : null;
    const pins = TURRETS.filter((t) => !team || t.team === team).filter((t) => tier === "all" || t.tier === tier).map(turretPin);
    return { paths: [], pins, numbered: false };
  }
  if (id === "turtle") return { paths: [], pins: PITS.turtle, numbered: false };
  if (id === "lord") return { paths: [], pins: PITS.lord, numbered: false };
  if (id === "purple") return { paths: [], pins: BUFFS.purple, numbered: false };
  if (id === "orange") return { paths: [], pins: BUFFS.orange, numbered: false };
  if (id === "bases") return { paths: [], pins: BASES, numbered: false };
  return { paths: [], pins: [], numbered: false };
}

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lessonId = "gold";
let tier = "all";
let focusId = null;
let movers = [];
const svg = document.getElementById("svg");
const sheet = document.getElementById("sheet");
const nav = document.getElementById("nav");
const plane = document.getElementById("plane");

function svgEl(name, attrs) {
  const node = document.createElementNS(NS, name);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}
function px(p) { return [p[0] / 100 * W, p[1] / 100 * H]; }
function smooth(points) {
  const pts = points.map(px);
  let d = "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + ", " + c2x.toFixed(1) + " " + c2y.toFixed(1) + ", " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
  }
  return d;
}
function lesson() { return LESSONS.find((item) => item.id === lessonId) || LESSONS[0]; }

function renderNav() {
  nav.innerHTML = "";
  GROUPS.forEach((group) => {
    const wrap = document.createElement("div");
    wrap.className = "group";
    const title = document.createElement("h2");
    title.textContent = group;
    wrap.appendChild(title);
    LESSONS.filter((item) => item.group === group).forEach((item) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip";
      button.textContent = item.short;
      button.setAttribute("aria-pressed", item.id === lessonId ? "true" : "false");
      button.addEventListener("click", () => pick(item.id));
      wrap.appendChild(button);
    });
    nav.appendChild(wrap);
  });
  const active = nav.querySelector('[aria-pressed="true"]');
  if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
}

function renderSheet() {
  const item = lesson();
  const view = viewFor(lessonId, tier);
  const index = LESSONS.findIndex((entry) => entry.id === lessonId);
  const focused = view.pins.find((pin) => pin.id === focusId);
  const turretLesson = item.group === "Turrets";
  sheet.innerHTML = "";
  const head = document.createElement("div");
  head.className = "sheet-head";
  const titles = document.createElement("div");
  const kicker = document.createElement("p");
  kicker.className = "kicker";
  kicker.textContent = item.group;
  const h = document.createElement("h3");
  h.textContent = item.title;
  titles.append(kicker, h);
  const count = document.createElement("p");
  count.className = "count";
  count.textContent = (index + 1) + "/" + LESSONS.length;
  head.append(titles, count);
  const lede = document.createElement("p");
  lede.className = "lede";
  lede.textContent = item.lede;
  sheet.append(head, lede);

  if (turretLesson) {
    const filters = document.createElement("div");
    filters.className = "filters";
    filters.setAttribute("role", "group");
    filters.setAttribute("aria-label", "Tower tier");
    [["all", "All tiers"], ["outer", "Outer"], ["inner", "Inner"], ["base", "Base"]].forEach(([id, label]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "mini";
      button.textContent = label;
      button.setAttribute("aria-pressed", tier === id ? "true" : "false");
      button.addEventListener("click", () => { tier = id; focusId = null; render(); });
      filters.appendChild(button);
    });
    sheet.appendChild(filters);
  }
  if (focused) {
    const call = document.createElement("p");
    call.className = "callout";
    const strong = document.createElement("strong");
    strong.textContent = focused.label + ". ";
    call.append(strong, document.createTextNode(focused.detail));
    sheet.appendChild(call);
  }
  const list = document.createElement("ul");
  item.bullets.forEach((bullet) => {
    const li = document.createElement("li");
    li.textContent = bullet;
    list.appendChild(li);
  });
  sheet.appendChild(list);
  if (view.pins.length > 1) {
    const row = document.createElement("div");
    row.className = "pins";
    view.pins.forEach((pin) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "mini";
      button.textContent = pin.label;
      button.setAttribute("aria-pressed", focusId === pin.id ? "true" : "false");
      button.addEventListener("click", () => setFocus(focusId === pin.id ? null : pin.id));
      row.appendChild(button);
    });
    sheet.appendChild(row);
  }
  const fine = document.createElement("p");
  fine.className = "fine";
  fine.textContent = "Fan-made 101 for the 5v5 map. Not affiliated with Moonton. Timings follow the current season and can move with a patch.";
  const steps = document.createElement("div");
  steps.className = "steps";
  const back = document.createElement("button");
  back.type = "button";
  back.className = "step";
  back.textContent = "Back";
  back.addEventListener("click", () => step(-1));
  const next = document.createElement("button");
  next.type = "button";
  next.className = "step primary";
  next.textContent = "Next lesson";
  next.addEventListener("click", () => step(1));
  steps.append(back, next);
  sheet.append(fine, steps);
}

function renderMap() {
  const view = viewFor(lessonId, tier);
  svg.replaceChildren();
  movers = [];
  view.paths.forEach((spec) => {
    const d = smooth(spec.points);
    const glow = svgEl("path", { d, fill: "none", stroke: spec.color, "stroke-width": "26", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: "0.28" });
    const core = svgEl("path", { d, fill: "none", stroke: spec.color, "stroke-width": "8", "stroke-linecap": "round", "stroke-linejoin": "round" });
    svg.append(glow, core);
    if (!reduced) {
      const len = core.getTotalLength();
      core.style.strokeDasharray = String(len);
      core.style.strokeDashoffset = String(len);
      core.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 1100, easing: "ease-out", fill: "forwards" });
    }
    for (let i = 0; i < 4; i++) {
      const dot = svgEl("circle", { r: "7", fill: spec.color });
      svg.appendChild(dot);
      movers.push({ path: core, el: dot, offset: i / 4 });
    }
    if (view.numbered && view.paths.length === 1) {
      badge(spec.points[0], "1");
      badge(spec.points[spec.points.length - 1], "2");
    }
  });
  view.pins.forEach((pin) => {
    const [x, y] = px(pin.at);
    const g = svgEl("g", { class: "pin", transform: "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")" });
    g.append(
      svgEl("circle", { r: "26", fill: pin.color, opacity: "0.22", class: "halo" }),
      svgEl("circle", { r: "16", fill: "none", stroke: pin.color, "stroke-width": "4", class: "ring" }),
      svgEl("circle", { r: "8", fill: pin.color, class: "dot" })
    );
    g.addEventListener("click", (event) => {
      event.stopPropagation();
      setFocus(focusId === pin.id ? null : pin.id);
    });
    g.dataset.id = pin.id;
    svg.appendChild(g);
  });
  paintPins();
}

function badge(at, digit) {
  const [x, y] = px(at);
  const g = svgEl("g", { transform: "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")" });
  g.append(svgEl("circle", { r: "24", fill: GOLD, stroke: "#1a1204", "stroke-width": "4" }));
  const text = svgEl("text", { "text-anchor": "middle", "dominant-baseline": "central", fill: "#1a1204", "font-size": "26", "font-family": "Rajdhani, sans-serif", "font-weight": "700" });
  text.textContent = digit;
  g.appendChild(text);
  svg.appendChild(g);
}

function paintPins() {
  svg.querySelectorAll(".pin").forEach((node) => {
    const dim = focusId !== null && node.dataset.id !== focusId;
    node.querySelector(".halo").setAttribute("opacity", dim ? "0.08" : "0.28");
    node.querySelector(".ring").setAttribute("opacity", dim ? "0.35" : "1");
    node.querySelector(".dot").setAttribute("opacity", dim ? "0.35" : "1");
  });
}

function pick(id) { lessonId = id; tier = "all"; focusId = null; render(); }
function setFocus(id) { focusId = id; renderSheet(); paintPins(); }
function step(dir) {
  const index = LESSONS.findIndex((item) => item.id === lessonId);
  pick(LESSONS[(index + dir + LESSONS.length) % LESSONS.length].id);
}
function render() { renderNav(); renderSheet(); renderMap(); }

let rx = 14, ry = -8, drag = false, lx = 0, ly = 0;
const stage = document.getElementById("stage");
function applyTilt(animate) {
  plane.classList.toggle("is-reset", animate);
  plane.style.setProperty("--rx", rx + "deg");
  plane.style.setProperty("--ry", ry + "deg");
}
applyTilt(false);
stage.addEventListener("pointerdown", (event) => {
  if (event.target.closest(".reset")) return;
  drag = true;
  lx = event.clientX;
  ly = event.clientY;
  stage.setPointerCapture(event.pointerId);
});
stage.addEventListener("pointermove", (event) => {
  if (!drag) return;
  ry = Math.max(-32, Math.min(32, ry + (event.clientX - lx) * 0.08));
  rx = Math.max(-6, Math.min(36, rx - (event.clientY - ly) * 0.08));
  lx = event.clientX;
  ly = event.clientY;
  applyTilt(false);
});
stage.addEventListener("pointerup", () => { drag = false; });
stage.addEventListener("pointercancel", () => { drag = false; });
document.getElementById("reset").addEventListener("click", () => { rx = 14; ry = -8; applyTilt(true); });

function frame(time) {
  if (!reduced) {
    movers.forEach((mover) => {
      const len = mover.path.getTotalLength();
      if (!len) return;
      const point = mover.path.getPointAtLength((((time * 0.00007) + mover.offset) % 1) * len);
      mover.el.setAttribute("cx", point.x.toFixed(1));
      mover.el.setAttribute("cy", point.y.toFixed(1));
    });
  }
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);
</script>
